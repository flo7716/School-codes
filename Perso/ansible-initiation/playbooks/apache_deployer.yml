- name: Installer Apache et démarrer le service
  hosts: localhost
  become: true
  tasks:
    - name: Installer Apache
      ansible.builtin.dnf:
        name: httpd
        state: present
        update_cache: yes

    - name: Démarrer le service Apache
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes
