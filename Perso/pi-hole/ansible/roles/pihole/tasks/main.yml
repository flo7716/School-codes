---
- name: Vérifier que Docker Desktop est accessible
  become: true
  become_user: "{{ pihole_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - info
  environment:
    HOME: "{{ pihole_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ pihole_uid }}"
  changed_when: false

- name: Vérifier la présence du fichier Compose
  ansible.builtin.stat:
    path: "{{ pihole_project_dir }}/docker-compose.yml"
  register: compose_file

- name: Refuser de continuer si Compose est absent
  ansible.builtin.assert:
    that:
      - compose_file.stat.exists
    fail_msg: "Le fichier docker-compose.yml est introuvable."

- name: Inspecter le conteneur Pi-hole existant
  become: true
  become_user: "{{ pihole_user }}"
  community.docker.docker_container_info:
    name: "{{ pihole_container }}"
    docker_host: "unix://{{ pihole_home }}/.docker/desktop/docker.sock"
  environment:
    HOME: "{{ pihole_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ pihole_uid }}"
  register: pihole_existing

- name: Vérifier que le conteneur existant est sain
  ansible.builtin.assert:
    that:
      - pihole_existing.exists
      - pihole_existing.container.State.Running
      - pihole_existing.container.State.Health.Status == "healthy"
    fail_msg: >-
      Le conteneur Pi-hole existe mais n'est pas sain.
      Aucune recréation automatique ne sera effectuée.
  when: pihole_existing.exists

- name: Déployer Pi-hole si le conteneur est absent
  become: true
  become_user: "{{ pihole_user }}"
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_project_dir }}"
    project_name: pi-hole
    cli_context: "{{ docker_context }}"
    state: present
  environment:
    HOME: "{{ pihole_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ pihole_uid }}"
  when: not pihole_existing.exists

- name: Attendre que le DNS Pi-hole réponde
  ansible.builtin.command:
    argv:
      - dig
      - +time=2
      - +tries=1
      - "@{{ pihole_dns_address }}"
      - -p
      - "{{ pihole_dns_port | string }}"
      - example.com
      - A
      - +short
  register: pihole_dns_test
  changed_when: false
  retries: 15
  delay: 2
  until:
    - pihole_dns_test.rc == 0
    - pihole_dns_test.stdout | trim | length > 0

- name: Confirmer le fonctionnement de Pi-hole
  ansible.builtin.debug:
    msg: >-
      Pi-hole fonctionne.
      DNS disponible sur {{ pihole_dns_address }}:{{ pihole_dns_port }}.
