
---
# ============================================================
# VALIDATION
# ============================================================

- name: Vérifier l'action de nettoyage
  ansible.builtin.assert:
    that:
      - pihole_action in ['disable', 'uninstall']
    fail_msg: "Action de nettoyage invalide."

- name: Interdire la suppression des données persistantes
  ansible.builtin.assert:
    that:
      - not (pihole_erase_data | bool)
    fail_msg: >-
      La suppression des données persistantes n'est pas autorisée
      par cette automatisation.

# ============================================================
# PROTECTION DU DISPATCHER
# ============================================================

- name: Créer le répertoire d'état Pi-hole
  become: true
  ansible.builtin.file:
    path: /var/lib/pihole-automation
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Marquer Pi-hole comme volontairement désactivé
  become: true
  ansible.builtin.file:
    path: /var/lib/pihole-automation/disabled
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: pihole_action in ['disable', 'uninstall']

# ============================================================
# RÉCUPÉRATION ET VALIDATION DES DNS DHCP
# ============================================================

- name: Récupérer les DNS fournis par NetworkManager
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - IP4.DNS
      - device
      - show
      - "{{ pihole_interface }}"
  register: wifi_dns
  changed_when: false

- name: Extraire les adresses DNS IPv4
  ansible.builtin.set_fact:
    wifi_dns_servers: >-
      {{ wifi_dns.stdout | regex_findall('[0-9]{1,3}(?:\.[0-9]{1,3}){3}') }}

- name: Vérifier que NetworkManager a fourni au moins un DNS IPv4
  ansible.builtin.assert:
    that:
      - wifi_dns_servers | length > 0
    fail_msg: >-
      Aucun serveur DNS IPv4 n'a été récupéré.
      Pi-hole ne sera pas arrêté.

- name: Tester les DNS du réseau Wi-Fi
  ansible.builtin.command:
    argv:
      - dig
      - +time=2
      - +tries=1
      - "@{{ item }}"
      - example.com
      - A
      - +short
  loop: "{{ wifi_dns_servers }}"
  register: wifi_dns_tests
  changed_when: false
  failed_when: false

- name: Vérifier qu'au moins un DNS Wi-Fi fonctionne
  ansible.builtin.assert:
    that:
      - >-
        wifi_dns_tests.results
        | selectattr('rc', 'equalto', 0)
        | selectattr('stdout', 'search', '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')
        | list
        | length > 0
    fail_msg: >-
      Les DNS Wi-Fi ne répondent pas correctement.
      Pi-hole ne sera pas arrêté.


# ============================================================
# DISABLE : ARRÊTER LE CONTENEUR SANS LE SUPPRIMER
# ============================================================

- name: Arrêter Pi-hole pour disable
  become: true
  become_user: "{{ pihole_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - stop
      - "{{ pihole_container }}"
  environment:
    HOME: "{{ pihole_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ pihole_uid }}"
  register: pihole_stop
  changed_when: pihole_stop.rc == 0
  failed_when: >-
    pihole_stop.rc != 0
    and 'No such container' not in pihole_stop.stderr
  when: pihole_action == 'disable'

# ============================================================
# UNINSTALL : SUPPRIMER LE DÉPLOIEMENT SANS LES DONNÉES
# ============================================================

- name: Supprimer le déploiement Compose pour uninstall
  become: true
  become_user: "{{ pihole_user }}"
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - compose
      - down
  args:
    chdir: "{{ pihole_project_dir }}"
  environment:
    HOME: "{{ pihole_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ pihole_uid }}"
  register: pihole_down
  changed_when: >-
    'Removed' in pihole_down.stdout
    or 'Stopped' in pihole_down.stdout
  when: pihole_action == 'uninstall'

# ============================================================
# UNINSTALL : SUPPRIMER LES SCRIPTS ET LE DISPATCHER
# ============================================================

- name: Supprimer le dispatcher NetworkManager
  become: true
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d/90-pihole-dns
    state: absent
  when: pihole_action == 'uninstall'

- name: Supprimer le script de gestion DNS
  become: true
  ansible.builtin.file:
    path: /usr/local/sbin/pihole-networkmanager.sh
    state: absent
  when: pihole_action == 'uninstall'

- name: Supprimer le marqueur de désactivation
  become: true
  ansible.builtin.file:
    path: /var/lib/pihole-automation/disabled
    state: absent
  when: pihole_action == 'uninstall'
