---
- name: Vérifier la présence de Docker
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - version
  changed_when: false

- name: Vérifier la disponibilité de Docker Compose
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - compose
      - version
  changed_when: false

- name: Vérifier le fichier Compose
  ansible.builtin.stat:
    path: "{{ docker_compose_file }}"
  register: compose_file

- name: Vérifier le fichier Compose
  ansible.builtin.assert:
    that:
      - compose_file.stat.exists
      - compose_file.stat.isreg
    fail_msg: "Le fichier docker-compose.yml est introuvable."

- name: Vérifier le répertoire des données Pi-hole
  ansible.builtin.file:
    path: "{{ pihole_data_dir }}"
    state: directory
    mode: "0755"

- name: Valider la configuration Compose
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - compose
      - -f
      - "{{ docker_compose_file }}"
      - config
      - --quiet
  changed_when: false

- name: Télécharger l'image Pi-hole
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - compose
      - -f
      - "{{ docker_compose_file }}"
      - pull
  register: pihole_pull
  changed_when: "'Downloaded newer image' in pihole_pull.stdout or 'Pulled' in pihole_pull.stdout"

- name: Démarrer Pi-hole
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - compose
      - -f
      - "{{ docker_compose_file }}"
      - up
      - -d
      - pihole
  register: pihole_up
  changed_when: >
    'Creating' in pihole_up.stdout or
    'Created' in pihole_up.stdout or
    'Starting' in pihole_up.stdout or
    'Started' in pihole_up.stdout or
    'Recreating' in pihole_up.stdout or
    'Recreated' in pihole_up.stdout

- name: Vérifier l'état du conteneur
  ansible.builtin.command:
    argv:
      - docker
      - --context
      - "{{ docker_context }}"
      - inspect
      - --format
      - "{{ '{{' }}.State.Status{{ '}}' }}"
      - "{{ pihole_container_name }}"
  register: pihole_status
  changed_when: false

- name: Afficher le résultat
  ansible.builtin.debug:
    msg: "Pi-hole est installé. État du conteneur : {{ pihole_status.stdout }}"
