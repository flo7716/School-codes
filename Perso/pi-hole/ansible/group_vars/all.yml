---
# Docker
docker_context: default
docker_compose_file: "{{ playbook_dir }}/../docker-compose.yml"

# Pi-hole
pihole_container_name: pihole
pihole_image: pihole/pihole:latest

# Répertoires
pihole_project_dir: "{{ playbook_dir }}/../"
pihole_data_dir: "{{ pihole_project_dir }}/etc-pihole"

# Réseau
pihole_interface: wlo1
pihole_dns_address: 127.0.0.1
pihole_dns_port: 54
pihole_web_port: 8081