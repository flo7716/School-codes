---
- name: Gestion de Pi-hole sur Fedora
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    valid_actions:
      - install
      - enable
      - disable
      - uninstall

  pre_tasks:
    - name: Vérifier que l'action demandée est valide
      ansible.builtin.assert:
        that:
          - pihole_action in valid_actions
        fail_msg: "Action invalide. Valeurs acceptées : install, enable, disable, uninstall."

    - name: Vérifier le système d'exploitation
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Fedora"
        fail_msg: "Ce playbook est actuellement prévu pour Fedora."

  roles:
    - role: pihole
      when: pihole_action in ['install', 'enable']

    - role: dns_automation
      when: pihole_action in ['install', 'enable']

    - role: cleanup
      when: pihole_action in ['disable', 'uninstall']