%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.0.10.0/24,10.0.20.0/24,10.0.30.0/24]"
    EXTERNAL_NET: "!$HOME_NET"

default-rule-path: /etc/suricata/rules
rule-files:
  - custom.rules

af-packet:
  - interface: eth0
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            payload: no
            metadata: yes
        - stats:
            enabled: no
  - stats:
      enabled: no

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
