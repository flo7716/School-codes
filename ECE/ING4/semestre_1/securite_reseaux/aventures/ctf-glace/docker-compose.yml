name: glace

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  edge:        # seul réseau exposé (reverse proxy / WAF)
    driver: bridge
  front:       # proxy <-> web  (aucun accès Internet)
    driver: bridge
    internal: true
  back:        # web <-> db     (aucun accès Internet)
    driver: bridge
    internal: true
  monitoring:  # logs / alertes (aucun accès Internet)
    driver: bridge
    internal: true
  mgmt:        # administration (Grafana en 127.0.0.1, webhook d'alerte)
    driver: bridge

volumes:
  db_data:
  loki_data:
  grafana_data:

services:
  # ---------- DMZ : reverse proxy + WAF ModSecurity (OWASP CRS) ----------
  proxy:
    <<: *hardened
    image: owasp/modsecurity-crs:nginx-alpine
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      BACKEND: "http://web:5000"
      MODSEC_RULE_ENGINE: "DetectionOnly"   # volontaire : détecte et journalise sans bloquer (cf. README)
      PARANOIA: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    networks: [edge, front]
    depends_on:
      web: { condition: service_healthy }

  # ---------- Application web (contient les vulnérabilités documentées) ----------
  web:
    <<: *hardened
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: glace
      DB_USER: webapp
      DB_PASSWORD: ${DB_PASSWORD}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [front, back]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------- Base de données (réseau interne uniquement) ----------
  db:
    <<: *hardened
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: glace
      MARIADB_USER: webapp
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    networks: [back]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ---------- Supervision : logs (Loki), collecte (Promtail), dashboards (Grafana) ----------
  loki:
    <<: *hardened
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [monitoring]

  promtail:
    <<: *hardened
    image: grafana/promtail:3.2.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # risque accepté et documenté (README §6)
    networks: [monitoring]
    depends_on: [loki]

  grafana:
    <<: *hardened
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"      # accessible uniquement depuis l'hôte
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring, mgmt]
    depends_on: [loki]

  # ---------- Détection d'incidents / alarmes ----------
  alerter:
    <<: *hardened
    build: ./alerter
    environment:
      LOKI_URL: http://loki:3100
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      INTERVAL: "15"
      COOLDOWN: "120"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring, mgmt]
    depends_on: [loki]
